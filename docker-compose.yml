services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beachkings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beachkings}
      POSTGRES_DB: ${POSTGRES_DB:-beachkings}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beachkings}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - beach-kings-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/pschwagler/beach-kings/frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NEXT_PUBLIC_* vars must be set at build time (Next.js inlines them during compilation)
        # - For production with nginx: use empty string (frontend paths already include /api)
        # - For local dev without nginx: use http://localhost:8000
        # Note: Frontend API calls already include /api prefix, so don't add it here
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      # Internal URL for SSR calls to backend (container-to-container)
      - BACKEND_INTERNAL_URL=http://backend:${BACKEND_INTERNAL_PORT:-8000}
    depends_on:
      backend:
        condition: service_started
    networks:
      - beach-kings-network
    restart: unless-stopped

  backend:
    image: ghcr.io/pschwagler/beach-kings/backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:${BACKEND_INTERNAL_PORT:-8000}"
      # - "${WHATSAPP_PORT:-3001}:3001"  # WhatsApp service is inactive
    env_file:
      - .env
    environment:
      - ENV=${ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-beachkings}:${POSTGRES_PASSWORD:-beachkings}@postgres:5432/${POSTGRES_DB:-beachkings}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-beachkings}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-beachkings}
      - POSTGRES_DB=${POSTGRES_DB:-beachkings}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      # - ENABLE_WHATSAPP=${ENABLE_WHATSAPP:-true}  # WhatsApp service is inactive
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - AUTH_DELIVERY_ENABLED=${AUTH_DELIVERY_ENABLED:-true}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - ENABLE_SMS=${ENABLE_SMS:-true}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-Beach League <noreply@beachleaguevb.com>}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@beachleaguevb.com}
      - ENABLE_EMAIL=${ENABLE_EMAIL:-true}
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY:-}
      - CREDENTIALS_JSON=${CREDENTIALS_JSON:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - DEBUG_BACKEND=${DEBUG_BACKEND:-0}
      - DEBUGPY_PORT=${DEBUGPY_PORT:-5678}
      - BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT:-8000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_S3_REGION=${AWS_S3_REGION:-us-west-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/backend
      - ./scripts:/app/scripts
      # - ./services/whatsapp:/app/services/whatsapp  # WhatsApp service is inactive
    networks:
      - beach-kings-network
    restart: unless-stopped

  auth-delivery-worker:
    image: ghcr.io/pschwagler/beach-kings/backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "backend.scripts.auth_delivery_worker"]
    env_file:
      - .env
    environment:
      - ENV=${ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-beachkings}:${POSTGRES_PASSWORD:-beachkings}@postgres:5432/${POSTGRES_DB:-beachkings}
      - AUTH_DELIVERY_ENABLED=${AUTH_DELIVERY_ENABLED:-true}
      - AUTH_DELIVERY_MAX_ATTEMPTS=${AUTH_DELIVERY_MAX_ATTEMPTS:-5}
      - ENABLE_SMS=${ENABLE_SMS:-true}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - ENABLE_EMAIL=${ENABLE_EMAIL:-true}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-Beach League <noreply@beachleaguevb.com>}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/backend
    networks:
      - beach-kings-network
    restart: unless-stopped

  moderation-worker:
    image: ghcr.io/pschwagler/beach-kings/backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "backend.scripts.moderation_worker"]
    env_file:
      - .env
    environment:
      - ENV=${ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-beachkings}:${POSTGRES_PASSWORD:-beachkings}@postgres:5432/${POSTGRES_DB:-beachkings}
      - MODERATION_MODE=${MODERATION_MODE:-off}
      - MODERATION_MODEL=${MODERATION_MODEL:-omni-moderation-latest}
      - MODERATION_AUTO_ENFORCE_SCORE=${MODERATION_AUTO_ENFORCE_SCORE:-0.95}
      - MODERATION_TRIAGE_MODEL=${MODERATION_TRIAGE_MODEL:-gpt-5.6-luna}
      - MODERATION_PROVIDER_TIMEOUT=${MODERATION_PROVIDER_TIMEOUT:-20}
      - MODERATION_MAX_ATTEMPTS=${MODERATION_MAX_ATTEMPTS:-5}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_MODERATION_EVIDENCE_BUCKET=${AWS_MODERATION_EVIDENCE_BUCKET:-}
      - AWS_S3_REGION=${AWS_S3_REGION:-us-west-2}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/backend
    networks:
      - beach-kings-network
    restart: unless-stopped

  push-worker:
    image: ghcr.io/pschwagler/beach-kings/backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "backend.scripts.push_worker"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-beachkings}:${POSTGRES_PASSWORD:-beachkings}@postgres:5432/${POSTGRES_DB:-beachkings}
      - PUSH_DELIVERY_ENABLED=${PUSH_DELIVERY_ENABLED:-false}
      - PUSH_MAX_ATTEMPTS=${PUSH_MAX_ATTEMPTS:-5}
      - EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/backend
    networks:
      - beach-kings-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - beach-kings-network
    restart: unless-stopped

networks:
  beach-kings-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
