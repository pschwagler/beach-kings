name: Inspect Player Account Links

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-account-inspection
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect selected production accounts without contact details
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/beach-kings
            git fetch origin ops/link-existing-players-20261018
            git show origin/ops/link-existing-players-20261018:scripts/inspect_player_account_pairs.py | \
              docker-compose exec -T backend bash -c "cd /app && PYTHONPATH=/app python -"
