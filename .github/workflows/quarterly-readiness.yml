name: Quarterly readiness review

on:
  schedule:
    - cron: "0 14 10 2,5,8,11 *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: quarterly-readiness
  cancel-in-progress: false

jobs:
  dependency-privacy-release:
    name: Dependency, privacy, and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Report production npm advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Verify Expo dependency compatibility
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Export production iOS bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://beachleaguevb.com
          EXPO_PUBLIC_WEB_URL: https://beachleaguevb.com
        run: npm run release:export:ios

      - name: Verify privacy, release, and no-OTA policy
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://beachleaguevb.com
          EXPO_PUBLIC_WEB_URL: https://beachleaguevb.com
        run: npm run release:preflight

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Report Python dependency advisories
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

      - name: Record owner review checklist
        run: |
          {
            echo "## Quarterly owner review"
            echo "Owner: Product owner"
            echo ""
            echo "Review dependency advisories, privacy-inventory drift, moderation operations, and current Apple policy before release sign-off."
          } >> "$GITHUB_STEP_SUMMARY"

  moderation-readiness:
    name: Moderation and readiness contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run isolated moderation and readiness tests
        run: |
          docker compose -f docker-compose.test.yml run --rm test-runner \
            pytest \
              backend/tests/test_moderation_worker_unit.py \
              backend/tests/test_moderation_escalation_alerts_unit.py \
              backend/tests/test_readiness_route.py \
              -q --timeout=90
        env:
          POSTGRES_USER: beachkings
          POSTGRES_PASSWORD: beachkings
          TEST_POSTGRES_DB: beachkings_test
          JWT_SECRET_KEY: quarterly-readiness-test-only

      - name: Clean up isolated test services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  app-review-policy:
    name: App Review policy sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current Apple policy sources are reachable
        run: |
          curl --fail --silent --show-error --location \
            --output /dev/null \
            https://developer.apple.com/app-store/review/guidelines/
          curl --fail --silent --show-error --location \
            --output /dev/null \
            https://developer.apple.com/news/upcoming-requirements/

      - name: Record manual policy-review reminder
        run: |
          {
            echo "## App Review policy review"
            echo "The current Guidelines and upcoming-requirements pages are reachable."
            echo "The product owner must review changes relevant to UGC, privacy, age assurance, sign-in, payments, and SDK requirements."
          } >> "$GITHUB_STEP_SUMMARY"
