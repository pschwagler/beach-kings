# Deploy to production (beachleaguevb.com)
# Deploy after successful main push CI, with a manual release path.
name: Deploy Prod

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.branch }}
          persist-credentials: false
      - name: Record source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  security:
    needs: resolve
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  build-and-push:
    outputs:
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      backend_digest: ${{ steps.backend.outputs.digest }}
    needs: [resolve, security]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Validate production frontend provider configuration
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "Production Google web client configuration is missing"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ghcr.io/pschwagler/beach-kings/frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Build and push backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/pschwagler/beach-kings/backend:latest

      - name: Scan the exact frontend image selected for deployment
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/pschwagler/beach-kings/frontend@${{ steps.frontend.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan the exact backend image selected for deployment
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/pschwagler/beach-kings/backend@${{ steps.backend.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    concurrency:
      group: prod-deploy
      queue: max
    runs-on: ubuntu-latest
    needs: [resolve, build-and-push]
    steps:
      - name: Deploy to prod EC2
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          AUTOMATIC_DEPLOY: ${{ github.event_name == 'workflow_run' }}
          FRONTEND_IMAGE: ghcr.io/pschwagler/beach-kings/frontend@${{ needs.build-and-push.outputs.frontend_digest }}
          BACKEND_IMAGE: ghcr.io/pschwagler/beach-kings/backend@${{ needs.build-and-push.outputs.backend_digest }}
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          command_timeout: 20m
          envs: DEPLOY_SHA,AUTOMATIC_DEPLOY,FRONTEND_IMAGE,BACKEND_IMAGE
          script: |
            set -e
            cd ~/beach-kings

            if ! git diff --quiet HEAD --; then
              echo "Production checkout has tracked changes. Review them on the host before deploying." >&2
              exit 1
            fi

            echo "=== Checking out release: $DEPLOY_SHA ==="
            if [ "$AUTOMATIC_DEPLOY" = "true" ]; then
              git fetch origin refs/heads/main
              if [ "$(git rev-parse FETCH_HEAD)" != "$DEPLOY_SHA" ]; then
                echo "This release is no longer at the tip of main. Deploy the current revision instead."
                exit 1
              fi
            else
              git fetch origin "$DEPLOY_SHA"
            fi
            git checkout --detach "$DEPLOY_SHA"
            # Correlate API readiness with the worker from this exact checkout.
            export RELEASE_READINESS_GENERATION="$(git rev-parse HEAD)-$(openssl rand -hex 16)"

            echo "=== Provider configuration preflight ==="
            python3 deployment/provider_config_preflight.py \
              --env-file .env \
              --app-config apps/mobile/app.json \
              --production

            echo "=== Pre-deployment database backup ==="
            if sudo systemctl cat beach-kings-db-backup.service > /dev/null 2>&1; then
              # A failed backup stops the deployment before images or migrations change.
              sudo systemctl start beach-kings-db-backup.service
              echo "Pre-deployment database backup completed"
            else
              echo "S3 backup service is not installed; refusing to deploy"
              echo "Complete deployment/backups/README.md before this release"
              exit 1
            fi

            echo "=== Pulling pre-built images ==="
            # This workflow is the production deployment contract. Exporting
            # ENV here overrides docker-compose's development-friendly local
            # default for every production service.
            export ENV=production
            docker-compose -f docker-compose.yml pull frontend backend

            echo "=== Starting containers ==="
            docker-compose -f docker-compose.yml up -d

            echo "=== Waiting for services to start ==="
            sleep 15

            echo "=== Health checks ==="
            # Backend health check
            backend_healthy=false
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
                echo "Backend is healthy"
                backend_healthy=true
                break
              fi
              echo "  Waiting for backend... (attempt $i/12)"
              sleep 5
            done
            if [ "$backend_healthy" = false ]; then
              echo "Backend failed to become healthy"
              exit 1
            fi

            echo "=== Production readiness ==="
            # A new moderation-worker generation reports ready only after its
            # own committed cycle. Its 242s progress budget is deliberately
            # below this 360s warm-up window.
            production_ready=false
            for i in $(seq 1 72); do
              if curl -sf http://localhost:8000/api/ready > /dev/null 2>&1; then
                echo "Production dependencies are ready"
                production_ready=true
                break
              fi
              echo "  Waiting for production dependencies... (attempt $i/72)"
              sleep 5
            done
            if [ "$production_ready" = false ]; then
              echo "Backend is running but production dependencies are not ready"
              curl -s http://localhost:8000/api/ready || true
              exit 1
            fi

            echo "=== Applying committed court catalog ==="
            docker-compose -f docker-compose.yml exec -T backend bash -c \
              "cd /app && PYTHONPATH=/app python -m backend.scripts.sync_catalog --apply"

            # Frontend health check
            frontend_healthy=false
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3000 > /dev/null 2>&1; then
                echo "Frontend is healthy"
                frontend_healthy=true
                break
              fi
              echo "  Waiting for frontend... (attempt $i/12)"
              sleep 5
            done
            if [ "$frontend_healthy" = false ]; then
              echo "Frontend failed to become healthy"
              exit 1
            fi

            echo "=== Required public pages ==="
            bash deployment/verify-public-web-routes.sh http://localhost:3000
            bash deployment/verify-public-web-routes.sh https://beachleaguevb.com

            echo "=== Cleaning up old images ==="
            docker image prune -f || true

            echo ""
            echo "=== Deploy complete ==="
            echo "https://beachleaguevb.com"
            echo "Source revision: $DEPLOY_SHA"

      - name: Record successful release
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          FRONTEND_IMAGE: ghcr.io/pschwagler/beach-kings/frontend@${{ needs.build-and-push.outputs.frontend_digest }}
          BACKEND_IMAGE: ghcr.io/pschwagler/beach-kings/backend@${{ needs.build-and-push.outputs.backend_digest }}
        run: |
          jq -n --arg sha "$RELEASE_SHA" --arg frontend "$FRONTEND_IMAGE" \
            --arg backend "$BACKEND_IMAGE" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{source_sha: $sha, frontend_image: $frontend, backend_image: $backend, run_url: $run}' \
            > release-manifest.json
          {
            echo '### Production release'
            echo
            echo '~~~json'
            cat release-manifest.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: release-manifest.json
          if-no-files-found: error
          overwrite: true
