# CI — runs on PRs targeting main or develop: lint, test, and build.
name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  lint-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate backup scripts and configuration
        run: |
          shellcheck deployment/backups/*.sh deployment/backups/tests/*.sh deployment/backups/tests/bin/*
          bash -n deployment/backups/*.sh deployment/backups/tests/*.sh deployment/backups/tests/bin/*
          python -m json.tool deployment/backups/s3-lifecycle.json > /dev/null

  test-database-backups:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run backup and restore integration test
        run: deployment/backups/tests/integration-test.sh

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Block high-severity production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Verify routing dependency compatibility
        run: npm run test:dependency-compatibility

      - name: Lint (JavaScript/TypeScript)
        run: npm run lint

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Lint (Python)
        run: ruff check apps/backend

      - name: Check format (Python)
        run: ruff format --check apps/backend

      - name: Validate committed catalog (no database)
        run: PYTHONPATH=apps python -m backend.scripts.sync_catalog --validate-only

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beachkings
          POSTGRES_PASSWORD: beachkings
          POSTGRES_DB: beachkings_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beachkings -d beachkings_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      PYTHONPATH: apps
      ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://beachkings:beachkings@localhost:5432/beachkings_test
      DATABASE_URL: postgresql+asyncpg://beachkings:beachkings@localhost:5432/beachkings_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: beachkings
      POSTGRES_PASSWORD: beachkings
      POSTGRES_DB: beachkings_test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      ENABLE_SMS: "false"
      ENABLE_EMAIL: "false"
      JWT_SECRET_KEY: test-secret-key-for-testing-only-change-in-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        timeout-minutes: 5
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: |
          # Run the complete suite against isolated service databases. Leave
          # time below the job limit to retain output after a stalled test.
          timeout --signal=TERM --kill-after=60s 22m \
            python -m pytest apps/backend/tests/ -v --tb=short \
              --timeout=90 --timeout-method=signal \
              --cov=backend --cov-report=xml:apps/backend/coverage.xml \
              --cov-report=term --cov-fail-under=82 \
            2>&1 | tee backend-ci.log

      - name: Upload backend diagnostics
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: backend-ci.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          if-no-files-found: warn

      - name: Upload to Codecov (optional)
        if: success()
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: apps/backend/coverage.xml
          fail_ci_if_error: false

  test-frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: cd apps/web && npm run test:unit:coverage

  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint mobile app
        run: npm run lint --workspace @beach-kings/mobile

      - name: Typecheck mobile app
        run: npx tsc --noEmit -p apps/mobile/tsconfig.json

      - name: Test mobile app
        run: npm test --workspace @beach-kings/mobile -- --runInBand

      - name: Verify Expo dependency health
        run: npx expo-doctor apps/mobile

      - name: Export production iOS bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://beachleaguevb.com
          EXPO_PUBLIC_WEB_URL: https://beachleaguevb.com
        run: npm run release:export:ios

      - name: Record exported bundle baseline
        working-directory: apps/mobile
        run: |
          bundle_kib=$(du -sk dist | cut -f1)
          echo "### Mobile export baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "iOS export: ${bundle_kib} KiB" >> "$GITHUB_STEP_SUMMARY"

      - name: Run release preflight
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://beachleaguevb.com
          EXPO_PUBLIC_WEB_URL: https://beachleaguevb.com
        run: npm run release:preflight

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build frontend production image
        run: |
          docker build \
            --file Dockerfile.frontend \
            --build-arg NEXT_PUBLIC_API_URL=https://beachleaguevb.com \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN= \
            --tag beach-kings/frontend:ci \
            .
