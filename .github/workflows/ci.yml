# CI — lint, test, and build for pull requests and post-merge main commits.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  lint-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate backup scripts and configuration
        run: |
          shellcheck deployment/backups/*.sh deployment/backups/tests/*.sh deployment/backups/tests/bin/*
          bash -n deployment/backups/*.sh deployment/backups/tests/*.sh deployment/backups/tests/bin/*
          python -m json.tool deployment/backups/s3-lifecycle.json > /dev/null

  test-database-backups:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run backup and restore integration test
        run: deployment/backups/tests/integration-test.sh

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Block high-severity production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Verify routing dependency compatibility
        run: npm run test:dependency-compatibility

      - name: Lint (JavaScript/TypeScript)
        run: npm run lint

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Lint (Python)
        run: ruff check apps/backend

      - name: Check format (Python)
        run: ruff format --check apps/backend

      - name: Validate committed catalog (no database)
        run: PYTHONPATH=apps python -m backend.scripts.sync_catalog --validate-only

  test-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: beachkings
          POSTGRES_PASSWORD: beachkings
          POSTGRES_DB: beachkings_test
          POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beachkings -d beachkings_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      PYTHONPATH: apps
      ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://beachkings:beachkings@localhost:5432/beachkings_test
      DATABASE_URL: postgresql+asyncpg://beachkings:beachkings@localhost:5432/beachkings_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: beachkings
      POSTGRES_PASSWORD: beachkings
      POSTGRES_DB: beachkings_test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      ENABLE_SMS: "false"
      ENABLE_EMAIL: "false"
      JWT_SECRET_KEY: test-secret-key-for-testing-only-change-in-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        timeout-minutes: 5
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        timeout-minutes: 24
        env:
          BACKEND_CI_CHECK_RUN_ID: ${{ job.check_run_id }}
          BACKEND_CI_REPORT_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s .github/ci -p 'test_*.py'
          python .github/ci/run_backend_tests.py

      - name: Upload backend diagnostics
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend-ci.log
            backend-ci-progress.json
            backend-ci-resources.jsonl
            backend-ci-summary.md
            backend-ci-junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          if-no-files-found: warn

      - name: Upload to Codecov (optional)
        if: success()
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: apps/backend/coverage.xml
          fail_ci_if_error: false

  test-frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: cd apps/web && npm run test:unit:coverage

  mobile-quality:
    # Mobile release checks run on PRs and manual CI runs.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint mobile app
        run: npm run lint --workspace @beach-kings/mobile

      - name: Typecheck mobile app
        run: npx tsc --noEmit -p apps/mobile/tsconfig.json

      - name: Test mobile app
        run: npm test --workspace @beach-kings/mobile -- --runInBand

      - name: Verify Expo dependency health
        run: npx expo-doctor apps/mobile

      - name: Export production iOS bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://beachleaguevb.com
          EXPO_PUBLIC_WEB_URL: https://beachleaguevb.com
        run: npm run release:export:ios

      - name: Record exported bundle baseline
        working-directory: apps/mobile
        run: |
          bundle_kib=$(du -sk dist | cut -f1)
          echo "### Mobile export baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "iOS export: ${bundle_kib} KiB" >> "$GITHUB_STEP_SUMMARY"

      - name: Run release preflight
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://beachleaguevb.com
          EXPO_PUBLIC_WEB_URL: https://beachleaguevb.com
        run: npm run release:preflight

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace @beach-kings/web

      - name: Build frontend production image
        run: |
          docker build \
            --file Dockerfile.frontend \
            --build-arg NEXT_PUBLIC_API_URL=https://beachleaguevb.com \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN= \
            --tag beach-kings/frontend:ci \
            .
