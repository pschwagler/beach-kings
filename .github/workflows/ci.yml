# CI — runs on PRs targeting main or develop: lint, test, and build.
name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  lint-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Report production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Lint (JavaScript/TypeScript)
        run: npm run lint

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint (Python)
        run: ruff check apps/backend

      - name: Check format (Python)
        run: ruff format --check apps/backend

      - name: Validate committed catalog (no database)
        run: PYTHONPATH=apps python -m backend.scripts.sync_catalog --validate-only

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run backend tests
        run: |
          docker compose -f docker-compose.test.yml up --build test-runner --abort-on-container-exit --exit-code-from test-runner
        env:
          POSTGRES_USER: beachkings
          POSTGRES_PASSWORD: beachkings
          TEST_POSTGRES_DB: beachkings_test
          JWT_SECRET_KEY: test-secret-key-for-testing-only-change-in-production

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          if-no-files-found: warn

      - name: Upload to Codecov (optional)
        if: success()
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: apps/backend/coverage.xml
          fail_ci_if_error: false

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  test-frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: cd apps/web && npm run test:unit:coverage

  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint mobile app
        run: npm run lint --workspace @beach-kings/mobile

      - name: Typecheck mobile app
        run: npx tsc --noEmit -p apps/mobile/tsconfig.json

      - name: Test mobile app
        run: npm test --workspace @beach-kings/mobile -- --runInBand

      - name: Verify Expo dependency health
        run: npx expo-doctor apps/mobile

      - name: Export production iOS bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://beachleaguevb.com
          EXPO_PUBLIC_WEB_URL: https://beachleaguevb.com
        run: npm run release:export:ios

      - name: Record exported bundle baseline
        working-directory: apps/mobile
        run: |
          bundle_kib=$(du -sk dist | cut -f1)
          echo "### Mobile export baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "iOS export: ${bundle_kib} KiB" >> "$GITHUB_STEP_SUMMARY"

      - name: Run release preflight
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://beachleaguevb.com
          EXPO_PUBLIC_WEB_URL: https://beachleaguevb.com
        run: npm run release:preflight

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
